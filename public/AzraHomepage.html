<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="azra.png">

    <!-- Fonts: Balsamiq Sans (Default), Gloria Hallelujah (Titles), Delius (IreneFlorentina substitute for long text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&family=Gloria+Hallelujah&family=Delius&display=swap" rel="stylesheet">
  
    <!-- External CSS -->
  <link rel="stylesheet" href="AzraHomepage.css">

</head>
<body>

    <!-- Floating top bar (appears when scrolling) -->
    <div class="top-bar bg-color-default" id="scroll-header">
        <div class="top-left">
            <img src="azra.png" class="top-icon" onerror="this.onerror=null;this.src='https://placehold.co/55x55/E6B09E/000000?text=A'">
            <span class="top-title">azra</span>
        </div>
        <img src="menubar.png" class="top-menu" id="top-menu-icon" onerror="this.onerror=null;this.src='https://placehold.co/60x60/E6B09E/000000?text=☰'">
    </div>

    <!-- Hero Section -->
    <section class="hero">

        <img src="flower.png" class="corner flower" onerror="this.onerror=null;this.src='https://placehold.co/120x120/FFC069/000000?text=FLOWER'">
        <img src="menubar.png" class="corner menu" id="corner-menu-icon" onerror="this.onerror=null;this.src='https://placehold.co/70x70/E6B09E/000000?text=☰'">

        <div class="hero-center" id="hero-center-content">
            <img 
                src="logo.png" 
                class="logo" 
                onerror="this.onerror=null;this.src='https://placehold.co/350x200/E6B09E/000000?text=CORGI+LOGO'"
                alt="Azra Corgi Logo"
            >
            <!-- Only tagline.png remains, and its size is increased via CSS -->
            <div class="tagline-container">
                <img 
                    src="tagline.png" 
                    class="tagline-image" 
                    onerror="this.onerror=null;this.src='https://placehold.co/300x70/E6B09E/000000?text=azra+TITLE'"
                    alt="azra title"
                >
            </div>
        </div>

    </section>

   <!-- DIRECTORY GRID -->
  <div class="grid-container">
  <section class="grid">

    <!-- ROW 1 (4 squares) -->
    <div class="card"><img src="kalachuchi.png"></div>
    <div class="card"><img src="grandstand.png"></div>
    <div class="card"><img src="library.png"></div>
    <div class="card"><img src="gazebos.png"></div>

    <!-- ROW 2 -->
    <div class="card span-2"><img src="gcu.png"></div>
    <div class="card"><img src="registrar.png"></div>
    <div class="card"><img src="josiesnook.png"></div>

    <!-- ROW 3 -->
    <div class="card"><img src="astb.png"></div>
    <div class="card span-2"><img src="swings.png"></div>
    <div class="card"><img src="basketball.png"></div>

    <!-- ROW 4 (CENTERED RECTANGLES) -->
    <div class="card span-2 center-row"><img src="flob.png"></div>
    <div class="card span-2 center-row"><img src="blob.png"></div>

  </section>
</div>

    <!-- Menu Overlay Structure (New) -->
    <div id="menu-overlay" class="menu-overlay">
        <div class="menu-content">
            <button class="menu-close" id="menu-close-button">X</button>

            <!-- Main Menu Links (UPDATED) -->
            <nav class="menu-links">
                <a href="#" class="menu-link-item">azra’s home</a>
                <a href="AzraAboutpage.html" class="menu-link-item">about azra</a>
                <a href="#lakbay-with-azra" class="menu-link-item">lakbay with azra</a>
                <a href="#behind-the-making" class="menu-link-item">behind the making</a>
                <a href="#pasasalamat" class="menu-link-item">pasasalamat</a>
                <!-- href="#" scrolls to the top of the page, acting as the home link -->
                <a href="#aircon" class="menu-link-item">aircon!</a>
                <a href="#nature" class="menu-link-item">nature!</a>
                <a href="#student-central" class="menu-link-item">student central</a>
            </nav>

            <!-- Social Media Logos -->
            <div class="socmeds-container">
                <img 
                    src="socmeds.png" 
                    alt="Social Media Links" 
                    class="socmeds-image" 
                    onerror="this.onerror=null;this.src='https://placehold.co/250x60/F0F8FF/000000?text=Social+Links'"
                >
            </div>
        </div>
    </div>


    <script>
        // JAVASCRIPT LOGIC
        document.addEventListener('DOMContentLoaded', () => {
            const topBar = document.getElementById('scroll-header');
            const heroCenter = document.getElementById('hero-center-content');
            const flower = document.querySelector('.flower');
            const body = document.body;

            // --- Menu Bar Elements (New) ---
            const menuOverlay = document.getElementById('menu-overlay');
            const menuCloseButton = document.getElementById('menu-close-button');
            const topMenuIcon = document.getElementById('top-menu-icon');
            const cornerMenuIcon = document.getElementById('corner-menu-icon');


            // --- Menu Open/Close Logic (New) ---
            const toggleMenu = () => {
                const isOpen = menuOverlay.classList.toggle('open');
                body.classList.toggle('menu-open', isOpen);
                
                // Hide or show scroll bar on body depending on menu state for dimming effect
                if (isOpen) {
                    body.style.overflow = 'hidden';
                } else {
                    body.style.overflow = '';
                }
            };
            
            // 1. Attach listeners to open the menu
            if (topMenuIcon) {
                topMenuIcon.addEventListener('click', toggleMenu);
            }
            if (cornerMenuIcon) {
                cornerMenuIcon.addEventListener('click', toggleMenu);
            }

            // 2. Attach listener to close the menu
            if (menuCloseButton) {
                menuCloseButton.addEventListener('click', toggleMenu);
            }
            
            // 3. Close menu when clicking the dimming background area
            if (menuOverlay) {
                menuOverlay.addEventListener('click', (e) => {
                    if (e.target === menuOverlay) {
                        toggleMenu();
                    }
                });
            }

            // 4. Close menu when a link inside the menu is clicked (good UX)
            document.querySelectorAll('.menu-link-item').forEach(link => {
                link.addEventListener('click', toggleMenu);
            });


            // --- Flower Hover Logic for Dynamic Background (Existing) ---
            // List of new background color classes
            const colorClasses = ['bg-color-1', 'bg-color-2', 'bg-color-3', 'bg-color-4', 'bg-color-5'];
            let currentColorIndex = -1; // Start before the first color

            const applyNewColor = () => {
                // Remove all previous color classes from the body and top bar
                colorClasses.forEach(cls => {
                    body.classList.remove(cls);
                    topBar.classList.remove(cls);
                });
                topBar.classList.remove('bg-color-default'); // Remove default class from the top bar

                // Cycle to the next index (0 through 4)
                currentColorIndex = (currentColorIndex + 1) % colorClasses.length;
                const newClass = colorClasses[currentColorIndex];

                // Apply the new background color class to both elements
                body.classList.add(newClass);
                topBar.classList.add(newClass);
            };

            if (flower) {
                // When the flower is hovered over (mouseenter), change the colors.
                flower.addEventListener('mouseenter', applyNewColor); 
            }
            
            // --- Header Visibility Logic (Existing) ---
            
            const observerOptions = {
                root: null, // Watch the whole screen
                rootMargin: '0px 0px 0px 0px', 
                threshold: 0.0 // Pop out when the Corgi scrolls out of view
            };

            const observerCallback = (entries, observer) => {
                entries.forEach(entry => {
                    // If the Corgi part is visible on the screen, hide the header.
                    if (entry.isIntersecting) {
                        topBar.classList.remove('visible');
                    } else {
                        // If the Corgi part is scrolled away, show the header.
                        topBar.classList.add('visible');
                    }
                });
            };

            const observer = new IntersectionObserver(observerCallback, observerOptions);

            if (heroCenter) {
                observer.observe(heroCenter);
            }
        });
    </script>
</body>
</html>
