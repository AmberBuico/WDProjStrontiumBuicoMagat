<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>azra - About</title>

    <link rel="icon" type="image/png" href="azra.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&family=Gloria+Hallelujah&family=Delius&display=swap" rel="stylesheet">
 
    <link rel="stylesheet" href="AzraAboutpage.css">
    
</head>
<body>

    <div class="top-bar bg-color-default" id="scroll-header">
        <div class="top-left">
            <a href="AzraHomepage.html" class="top-bar-home-link">
                <img src="azra.png" class="top-icon" onerror="this.onerror=null;this.src='https://placehold.co/55x55/E6B09E/000000?text=A'">
                <span class="top-title">azra</span>
            </a>
        </div>
        <img src="menubar.png" class="top-menu" id="top-menu-icon" onerror="this.onerror=null;this.src='https://placehold.co/60x60/E6B09E/000000?text=☰'">
    </div>

    <header class="header-section">
        <div class="header-left">
            <img src="azra.png" class="azra-icon" alt="Azra Icon">
            <span class="azra-title">azra</span>
        </div>
        <img src="menubar.png" class="doghouse-icon" id="corner-menu-icon" alt="Menu Icon">
    </header>

    <section class="about-azra-section" id="hero-center-content">
        <img 
            src="aboutazra.png" 
            class="about-azra-image" 
            alt="About Azra text and dog illustration"
            onerror="this.onerror=null;this.src='https://placehold.co/1000x400/FFC1C1/000000?text=ABOUT+AZRA+BOX'"
        >
    </section>
    
    <main class="content-wrapper">

        <section class="creators-grid">
            
            <div class="grid-item zach-pic-container">
                <img 
                    src="zach.png" 
                    class="creator-image" 
                    alt="Picture of Zach"
                    onerror="this.onerror=null;this.src='https://placehold.co/300x200/FFFFFF/000000?text=ZACH+PIC'"
                >
            </div>
            
            <div class="grid-item text-box">
                <img 
                    src="aboutzach.png" 
                    class="box-image" 
                    alt="About Zach text"
                    onerror="this.onerror=null;this.src='https://placehold.co/300x200/D0B0F7/000000?text=ABOUT+ZACH+BOX'"
                >
            </div>
            
            <div class="grid-item text-box span-row-2">
                <img 
                    src="explanation.png" 
                    class="box-image" 
                    alt="Explanation text"
                    onerror="this.onerror=null;this.src='https://placehold.co/300x400/D0B0F7/000000?text=EXPLANATION+BOX'"
                >
            </div>

            <div class="grid-item amber-pic-container">
                <img 
                    src="amber.png" 
                    class="creator-image" 
                    alt="Picture of Amber"
                    onerror="this.onerror=null;this.src='https://placehold.co/300x200/FFFFFF/000000?text=AMBER+PIC'"
                >
            </div>

            <div class="grid-item text-box">
                <img 
                    src="aboutamber.png" 
                    class="box-image" 
                    alt="About Amber text"
                    onerror="this.onerror=null;this.src='https://placehold.co/300x200/D0B0F7/000000?text=ABOUT+AMBER+BOX'"
                >
            </div>

            </section>

        <div style="height: 100px;"></div>

    </main>
    
    <div id="menu-overlay" class="menu-overlay">
        <div class="menu-content">
            <button class="menu-close" id="menu-close-button">X</button>
            <nav class="menu-links">
                <a href="AzraHomepage.html" class="menu-link-item">azra’s home</a>
                <a href="#" class="menu-link-item">about azra</a>
                <a href="#" class="menu-link-item">lakbay with azra</a>
                <a href="#" class="menu-link-item">behind the making</a>
                <a href="#" class="menu-link-item">pasasalamat</a>
                <a href="#" class="menu-link-item">aircon!</a>
                <a href="#" class="menu-link-item">nature!</a>
                <a href="#" class="menu-link-item">student central</a>
            </nav>
            <div class="socmeds-container">
                <img src="socmeds.png" alt="Social Media Links" class="socmeds-image" 
                onerror="this.onerror=null;this.src='https://placehold.co/250x60/F0F8FF/000000?text=Social+Links'">
            </div>
        </div>
    </div>


   <script>
    document.addEventListener('DOMContentLoaded', () => {
        const topBar = document.getElementById('scroll-header');
        const body = document.body;

        const menuOverlay = document.getElementById('menu-overlay');
        const menuCloseButton = document.getElementById('menu-close-button');
        const topMenuIcon = document.getElementById('top-menu-icon');
        const cornerMenuIcon = document.getElementById('corner-menu-icon');

        const toggleMenu = () => {
            const isOpen = menuOverlay.classList.toggle('open');
            body.classList.toggle('menu-open', isOpen);
            
            if (isOpen) {
                body.style.overflow = 'hidden';
            } else {
                body.style.overflow = '';
            }
        };
        
        if (topMenuIcon) {
            topMenuIcon.addEventListener('click', toggleMenu);
        }
        if (cornerMenuIcon) {
            cornerMenuIcon.addEventListener('click', toggleMenu);
        }

        if (menuCloseButton) {
            menuCloseButton.addEventListener('click', toggleMenu);
        }
        
        if (menuOverlay) {
            menuOverlay.addEventListener('click', (e) => {
                if (e.target === menuOverlay) {
                    toggleMenu();
                }
            });
        }

        document.querySelectorAll('.menu-link-item').forEach(link => {
            link.addEventListener('click', toggleMenu);
        });

        const headerSection = document.querySelector('.header-section');
        const headerHeightToPass = headerSection ? headerSection.offsetHeight : 150; 
        const checkScroll = () => {

            if (window.scrollY > headerHeightToPass) {
                topBar.classList.add('visible');
            } else {
                topBar.classList.remove('visible');
            }
        };

            checkScroll(); 
            window.addEventListener('scroll', checkScroll);

    });
</script>
</body>
</html>
