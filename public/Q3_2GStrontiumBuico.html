<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Club Application Form</title>
    <style>
        body {}
            background-image: url('guitar.webp');
            background-size: cover;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        form {
            background-color: rgba(255, 255, 255, 0.85); 
            padding: 30px;
            border-radius: 15px;
            width: 450px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
        }

        h2 {
            text-align: center;
            color: #4a3728;
        }

        fieldset {
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 10px;
        }

        legend {
            font-weight: bold;
            color: #d2691e;
        }

        label {
            display: block;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #aaa;
            border-radius: 5px;
            box-sizing: border-box; 
        }


        input:focus, select:focus, textarea:focus {
            outline: none;
            border: 2px solid #d2691e;
            background-color: #fff9f0;
        }
        
        .error-border {
            border: 2px solid red !important;
            background-color: #ffe6e6;
        }

        .button-group {
            text-align: center;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            border: none;
            background-color: #d2691e;
            color: white;
            font-weight: bold;
        }

        button[type="reset"] {
            background-color: #888;
        }
    </style>
</head>

<body>

    <form method="post" action="submit" 
          onsubmit="return confirm('Are you sure you want to submit your application?')" 
          onreset="return confirm('Are you sure you want to clear all fields?')">
        
        <h2>Club Application</h2>

        <fieldset>
            <legend>Personal Information</legend>
            
            <label>Student ID: 
                <input type="number" name="studentID" required onblur="checkEmpty(this)">
            </label>

            <label>Full Name: 
                <input type="text" name="fullName" required onblur="checkEmpty(this)">
            </label>

            <label>Birthday: 
                <input type="date" name="bday" required onblur="checkEmpty(this)">
            </label>

            <label>Email Address: 
                <input type="email" name="email" required onblur="checkEmpty(this)">
            </label>
        </fieldset>

        <fieldset>
            <legend>Application Details</legend>

            <label>Mobile Phone: 
                <input type="text" name="mobile" required onblur="checkEmpty(this)">
            </label>

            <label>Grade Level:
                <select name="grade" required>
                    <option value="">--Select--</option>
                    <option value="g7">Grade 7</option>
                    <option value="g8">Grade 8</option>
                    <option value="g9">Grade 9</option>
                    <option value="g10">Grade 10</option>
                    <option value="g10">Grade 11</option>
                    <option value="g10">Grade 12</option>
                </select>
            </label>

            <label>Type: 
                <br>
                <input type="radio" name="status" value="int" required style="width: auto;"> Intern
                <input type="radio" name="status" value="ext" required style="width: auto;"> Extern
            </label>

            <label>Preferred Organization:
                <select name="club" required>
                    <option value="">--Choose a Club--</option>
                    <option value="Likha">Art Society</option>
                    <option value="Himig Agham">Music Ensemble</option>
                    <option value="XYZ">Tech Wizards</option>
                    <option value="Flux">Varsity Club</option>
                    <option value="Sightlines">Drama Guild</option>
                </select>
            </label>
        </fieldset>

        <label>Why do you want to join?
            <textarea name="reason" rows="4" required onblur="checkEmpty(this)"></textarea>
        </label>

        <div class="button-group">
            <button type="submit">Submit Application</button>
            <button type="reset">Clear Form</button>
        </div>
    </form>

    <script>
        // Part B: Onblur function to mark empty fields
        function checkEmpty(element) {
            if (element.value.trim() === "") {
                element.classList.add("error-border");
            } else {
                element.classList.remove("error-border");
            }
        }
    </script>

</body>
</html>
